
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE STATE | Helper Eğitim Akademisi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d2ad58;--bg:#101114;--panel:#191b20;--line:#30333b;--muted:#a3a6af}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5f5f5;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:420px;background:var(--panel);border:1px solid #66532f;border-radius:18px;padding:30px;text-align:center}
.logo{font-size:38px;color:var(--gold)}
h1{font-size:21px;color:var(--gold);margin:12px 0}
.login p{color:var(--muted);font-size:13px;line-height:1.6}
input{width:100%;padding:14px;margin:8px 0;background:#101114;color:white;border:1px solid var(--line);border-radius:8px}
.gold{background:var(--gold);color:#17130b;border:0;padding:13px 17px;border-radius:8px;font-weight:bold}
.login .gold{width:100%;margin-top:12px}
.message{padding:12px;background:#292b31;border-radius:8px;margin-top:12px;font-size:13px;overflow-wrap:anywhere}
.layout{display:flex;min-height:100vh}
.sidebar{width:255px;flex-shrink:0;background:#17191e;border-right:1px solid var(--line);padding:20px 13px}
.brand{font-weight:bold;color:var(--gold);font-size:16px;padding:8px 10px 20px;line-height:1.5}
.nav-title{font-size:10px;color:#858995;padding:14px 10px 7px;letter-spacing:1px}
.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#d5d6da;padding:12px 10px;border-radius:7px;margin:2px 0;font-size:13px}
.nav button.active,.nav button:hover{background:#34302a;color:var(--gold)}
.main{flex:1;min-width:0}
.topbar{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#17191e;gap:10px}
.topbar strong{color:var(--gold);font-size:13px}
.content{padding:25px;max-width:1250px;margin:auto}
.page-title{font-size:23px;margin:0 0 7px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}
.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:15px}
.card small{color:var(--muted)}
.card h2{font-size:26px;color:var(--gold);margin:12px 0 0}
.section h3{font-size:16px;margin:0 0 14px;color:var(--gold)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;vertical-align:top}
th{color:var(--gold);font-weight:bold}
td{color:#e1e1e1;overflow-wrap:anywhere}
.action{border:1px solid var(--line);background:#252830;color:white;border-radius:6px;padding:8px 10px;margin:2px;font-size:12px}
.action.approve{background:#315b40;border-color:#477b59}
.action.reject{background:#6a3434;border-color:#874747}
.muted{color:var(--muted)}
.status{padding:4px 8px;border-radius:20px;background:#34302a;color:var(--gold);font-size:11px}
.notice{padding:14px;background:#27251f;border:1px solid #65532f;border-radius:9px;font-size:13px;line-height:1.6}
.mobile-menu{display:none}
@media(max-width:760px){
 .layout{display:block}
 .sidebar{width:100%;border-right:0;border-bottom:1px solid var(--line);padding:10px}
 .brand{padding:8px}
 .nav{display:flex;overflow-x:auto;gap:5px}
 .nav-title{display:none}
 .nav button{white-space:nowrap;width:auto;flex-shrink:0}
 .content{padding:16px}
 .topbar{padding:0 14px}
}
</style>
</head>
<body>

<section id="loginScreen" class="login-wrap">
 <div class="login">
  <div class="logo">★</div>
  <h1>ONE STATE TR</h1>
  <h2>HELPER EĞİTİM AKADEMİSİ</h2>
  <p>Öğrenci ve yönetim giriş ekranı</p>
  <form id="loginForm">
   <input id="email" type="email" placeholder="E-posta adresiniz" required>
   <input id="password" type="password" placeholder="Şifreniz" required>
   <button id="loginButton" class="gold" type="submit">GİRİŞ YAP</button>
  </form>
  <div id="loginMessage" class="message hidden"></div>
  <p>Yetkisiz erişim engellenmiştir. Eğitim erişimi yönetim onayına bağlıdır.</p>
 </div>
</section>

<div id="app" class="layout hidden">
 <aside class="sidebar">
  <div class="brand">★ ONE STATE TR<br>HELPER AKADEMİSİ</div>
  <div class="nav-title">AKADEMİ</div>
  <nav id="studentNav" class="nav"></nav>
  <div class="nav-title">YÖNETİM PANELİ</div>
  <nav id="managementNav" class="nav"></nav>
 </aside>
 <main class="main">
  <header class="topbar">
   <strong id="userLabel">ONE STATE AKADEMİ</strong>
   <button id="logoutButton" class="action">Çıkış Yap</button>
  </header>
  <div class="content">
   <h1 id="pageTitle" class="page-title">Ana Sayfa</h1>
   <div id="pageSub" class="sub">Eğitim platformuna hoş geldiniz.</div>
   <div id="pageContent"></div>
  </div>
 </main>
</div>

<script>
const SUPABASE_URL="https://ijnuygaxmucnyquxhqas.supabase.co";
const SUPABASE_KEY="sb_publishable_JpkrdGNV9ki--h4ET92aRA_eIH_hIOL";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let currentProfile=null;
let currentRole="";
let currentPage="Ana Sayfa";

const studentItems=[
 "Ana Sayfa","Helper Eğitimleri","Admin Paneli Kullanımı","Komutlar",
 "Makrolar","Sunucu Kuralları","Ceza Rehberi","Bilet Yönetimi",
 "Video Anlatımları","Görsel Eğitimler","Sınavlar","Eğitim Takibim",
 "Duyurular","Profilim"
];

const managementItems=[
 "Genel Bakış","Başvuru Yönetimi","Üye Yönetimi","Eğitim İçerik Yönetimi",
 "Eğitim Takibi","Video Yönetimi","Sınav Yönetimi","Rol ve Yetki Yönetimi",
 "Raporlama","Duyuru Yönetimi","Sertifika Yönetimi",
 "Yönetim İşlem Geçmişi","Sistem Ayarları"
];

const descriptions={
 "Ana Sayfa":"Akademi öğrenci ekranı.",
 "Helper Eğitimleri":"Yayınlanmış eğitim içerikleri.",
 "Admin Paneli Kullanımı":"Yönetici paneli eğitimleri.",
 "Komutlar":"Komut eğitimleri.",
 "Makrolar":"Makro eğitimleri.",
 "Sunucu Kuralları":"Sunucu kuralları ve bilgilendirmeler.",
 "Ceza Rehberi":"Ceza rehberi eğitimleri.",
 "Bilet Yönetimi":"Bilet yönetimi eğitimleri.",
 "Video Anlatımları":"Eğitim videoları.",
 "Görsel Eğitimler":"Görsel eğitim materyalleri.",
 "Sınavlar":"Eğitim sınavları.",
 "Eğitim Takibim":"Kişisel eğitim ilerlemeniz.",
 "Duyurular":"Akademi duyuruları.",
 "Profilim":"Hesap bilgileriniz.",
 "Genel Bakış":"Yönetim paneli genel görünümü.",
 "Başvuru Yönetimi":"Öğrenci başvurularını inceleyin.",
 "Üye Yönetimi":"Akademi üyeleri.",
 "Eğitim İçerik Yönetimi":"Eğitim içeriklerinin yönetimi.",
 "Eğitim Takibi":"Öğrencilerin ilerleme kayıtları.",
 "Video Yönetimi":"Eğitim video kayıtları.",
 "Sınav Yönetimi":"Sınav ve soru yönetimi.",
 "Rol ve Yetki Yönetimi":"Hesap rolleri ve yetkileri.",
 "Raporlama":"Akademi faaliyet kayıtları.",
 "Duyuru Yönetimi":"Akademi duyuruları.",
 "Sertifika Yönetimi":"Sertifika işlemleri.",
 "Yönetim İşlem Geçmişi":"Yönetim işlem kayıtları.",
 "Sistem Ayarları":"Akademi sistem bilgileri."
};

function el(id){return document.getElementById(id)}
function safe(value){
 if(value===null||value===undefined)return "—";
 if(typeof value==="object")return JSON.stringify(value);
 return String(value);
}
function showMessage(target,text){
 el(target).textContent=text;
 el(target).classList.remove("hidden");
}
function isFullManagement(){
 return currentRole==="CM"||currentRole==="Responsible Admin";
}
function isManagement(){
 return ["CM","Responsible Admin","Administrator"].includes(currentRole);
}
function makeNav(){
 el("studentNav").innerHTML="";
 el("managementNav").innerHTML="";
 studentItems.forEach(item=>addNav("studentNav",item));
 if(isManagement())managementItems.forEach(item=>addNav("managementNav",item));
}
function addNav(id,item){
 const b=document.createElement("button");
 b.textContent=item;
 b.className=item===currentPage?"active":"";
 b.onclick=()=>openPage(item);
 el(id).appendChild(b);
}
function setPage(title,sub){
 el("pageTitle").textContent=title;
 el("pageSub").textContent=sub||descriptions[title]||"";
 el("pageContent").innerHTML="";
}
function addNotice(text){
 const d=document.createElement("div");
 d.className="notice";
 d.textContent=text;
 el("pageContent").appendChild(d);
}
function addSection(title){
 const d=document.createElement("section");
 d.className="section";
 const h=document.createElement("h3");
 h.textContent=title;
 d.appendChild(h);
 el("pageContent").appendChild(d);
 return d;
}
function renderTable(container,rows,columns){
 if(!rows||!rows.length){
  const p=document.createElement("p");
  p.className="muted";
  p.textContent="Henüz gösterilecek kayıt bulunmuyor.";
  container.appendChild(p);
  return;
 }
 const wrap=document.createElement("div");wrap.className="table-wrap";
 const table=document.createElement("table");
 const head=document.createElement("tr");
 columns.forEach(c=>{const th=document.createElement("th");th.textContent=c.label;head.appendChild(th)});
 const thead=document.createElement("thead");thead.appendChild(head);table.appendChild(thead);
 const tbody=document.createElement("tbody");
 rows.forEach(row=>{
  const tr=document.createElement("tr");
  columns.forEach(c=>{
   const td=document.createElement("td");
   td.textContent=safe(row[c.key]);
   tr.appendChild(td);
  });
  tbody.appendChild(tr);
 });
 table.appendChild(tbody);wrap.appendChild(table);container.appendChild(wrap);
}
async function fetchRows(table,limit=100){
 const {data,error}=await db.from(table).select("*").limit(limit);
 if(error)throw error;
 return data||[];
}
async function showTable(table,title,columns){
 const section=addSection(title);
 const loading=document.createElement("p");loading.className="muted";loading.textContent="Yükleniyor...";
 section.appendChild(loading);
 try{
  const rows=await fetchRows(table);
  loading.remove();
  renderTable(section,rows,columns);
 }catch(e){
  loading.textContent="Bu kayıtlar yüklenemedi: "+e.message;
 }
}
async function showApplications(){
 const section=addSection("Öğrenci başvuruları");
 const loading=document.createElement("p");loading.textContent="Başvurular yükleniyor...";
 section.appendChild(loading);
 try{
  const rows=await fetchRows("applications");
  loading.remove();
  if(!rows.length){renderTable(section,[],[]);return}
  const wrap=document.createElement("div");wrap.className="table-wrap";
  const table=document.createElement("table");
  table.innerHTML="<thead><tr><th>Başvuru</th><th>Öğrenci</th><th>Durum</th><th>İşlem</th></tr></thead>";
  const body=document.createElement("tbody");
  rows.forEach(row=>{
   const tr=document.createElement("tr");
   const name=row.display_name||row.name||row.username||row.user_id||"İsimsiz";
   [row.id,name,row.status].forEach(value=>{
    const td=document.createElement("td");td.textContent=safe(value);tr.appendChild(td);
   });
   const actions=document.createElement("td");
   if(row.status==="Pending"){
    const yes=document.createElement("button");yes.className="action approve";yes.textContent="Onayla";
    yes.onclick=()=>reviewApplication(row.id,"Approved");
    const no=document.createElement("button");no.className="action reject";no.textContent="Reddet";
    no.onclick=()=>reviewApplication(row.id,"Rejected");
    actions.append(yes,no);
   }else actions.textContent="İşlem yapılmış";
   tr.appendChild(actions);body.appendChild(tr);
  });
  table.appendChild(body);wrap.appendChild(table);section.appendChild(wrap);
 }catch(e){loading.textContent="Başvurular yüklenemedi: "+e.message}
}
async function reviewApplication(id,decision){
 if(!confirm(decision==="Approved"?"Bu başvuruyu onaylamak istiyor musunuz?":"Bu başvuruyu reddetmek istiyor musunuz?"))return;
 try{
  const {error}=await db.rpc("review_application",{
   p_application_id:id,p_decision:decision
  });
  if(error)throw error;
  alert("Başvuru işlemi tamamlandı.");
  openPage("Başvuru Yönetimi");
 }catch(e){alert("İşlem yapılamadı: "+e.message)}
}
async function openPage(page){
 currentPage=page;
 makeNav();
 setPage(page,descriptions[page]);
 try{
  if(page==="Ana Sayfa"||page==="Genel Bakış"){
   const section=addSection("Hoş geldiniz");
   section.innerHTML+="<p>ONE STATE HELPER EĞİTİM AKADEMİSİ platformuna hoş geldiniz.</p>";
   const cards=addSection("Hesap bilgileriniz");
   cards.innerHTML+="<p>Hesap: "+safe(currentUser.email)+"</p><p>Rol: "+safe(currentRole)+"</p>";
   if(isManagement())addNotice("Yönetim yetkileriniz hesabınızın rolüne göre sınırlandırılmıştır.");
   else addNotice("Eğitim içeriklerine erişiminiz başvuru onayınıza bağlıdır.");
   return;
  }
  if(page==="Başvuru Yönetimi"){
   if(!isManagement())return addNotice("Bu bölüme erişim yetkiniz yok.");
   return await showApplications();
  }
  if(page==="Üye Yönetimi"){
   if(!isManagement())return addNotice("Bu bölüme erişim yetkiniz yok.");
   return await showTable("profiles","Üye listesi",[
    {key:"id",label:"Hesap ID"},{key:"role",label:"Rol"},{key:"created_at",label:"Kayıt tarihi"}
   ]);
  }
  if(page==="Eğitim Takibi"||page==="Eğitim Takibim"){
   return await showTable("lesson_progress","Eğitim ilerlemesi",[
    {key:"student_id",label:"Öğrenci"},{key:"lesson_id",label:"Ders"},
    {key:"video_seconds",label:"Video saniyesi"},{key:"completed",label:"Tamamlandı"},
    {key:"updated_at",label:"Güncelleme"}
   ]);
  }
  if(page==="Duyurular"||page==="Duyuru Yönetimi"){
   return await showTable("announcements","Duyurular",[
    {key:"title",label:"Başlık"},{key:"content",label:"İçerik"},
    {key:"published",label:"Yayınlandı"},{key:"created_at",label:"Tarih"}
   ]);
  }
  if(page==="Sınavlar"||page==="Sınav Yönetimi"){
   if(page==="Sınav Yönetimi"&&!isManagement())return addNotice("Erişim yetkiniz yok.");
   return await showTable("exams","Sınavlar",[
    {key:"id",label:"Sınav ID"},{key:"title",label:"Başlık"},
    {key:"published",label:"Yayınlandı"}
   ]);
  }
  if(page==="Yönetim İşlem Geçmişi"){
   if(!isFullManagement())return addNotice("Bu bölüm yalnızca CM ve Responsible Admin erişimine açıktır.");
   return await showTable("management_log","Yönetim işlem geçmişi",[
    {key:"id",label:"Kayıt"},{key:"created_at",label:"Tarih"},
    {key:"action",label:"İşlem"},{key:"details",label:"Detay"}
   ]);
  }
  if(page==="Profilim"){
   const section=addSection("Hesap bilgilerim");
   section.innerHTML+="<p>E-posta: "+safe(currentUser.email)+"</p><p>Rol: "+safe(currentRole)+"</p><p>Hesap ID: "+safe(currentUser.id)+"</p>";
   return;
  }
  const tableMap={
   "Helper Eğitimleri":"courses",
   "Admin Paneli Kullanımı":"lessons",
   "Komutlar":"lessons",
   "Makrolar":"lessons",
   "Sunucu Kuralları":"lessons",
   "Ceza Rehberi":"lessons",
   "Bilet Yönetimi":"lessons",
   "Video Anlatımları":"lessons",
   "Görsel Eğitimler":"lessons",
   "Eğitim İçerik Yönetimi":"lessons",
   "Video Yönetimi":"lessons",
   "Raporlama":"exam_attempts"
  };
  if(tableMap[page]){
   if(["Eğitim İçerik Yönetimi","Video Yönetimi","Raporlama"].includes(page)&&!isManagement())
    return addNotice("Bu bölüme erişim yetkiniz yok.");
   const table=tableMap[page];
   return await showTable(table,descriptions[page],[
    {key:"id",label:"Kayıt ID"},
    {key:"title",label:"Başlık"},
    {key:"description",label:"Açıklama"},
    {key:"published",label:"Yayın durumu"}
   ]);
  }
  if(page==="Rol ve Yetki Yönetimi"||page==="Sertifika Yönetimi"||page==="Sistem Ayarları"){
   if(!isFullManagement())return addNotice("Bu bölüm yalnızca CM ve Responsible Admin erişimine açıktır.");
   return addNotice("Bu bölümün yönetim işlemleri sonraki güvenli kurulum aşamasında etkinleştirilecektir. Şu anda değişiklik yapılmamaktadır.");
  }
  addNotice("Bu bölüm hazırlanıyor.");
 }catch(e){addNotice("İçerik yüklenemedi: "+e.message)}
}
async function enterApp(user,profile){
 currentUser=user;
 currentProfile=profile;
 currentRole=profile.role||"";
 if(!["Student","CM","Responsible Admin","Administrator"].includes(currentRole)){
  await db.auth.signOut();
  throw new Error("Bu hesabın akademi erişim rolü tanımlı değil.");
 }
 if(currentRole==="Student"){
  const {data:application,error}=await db.from("applications")
   .select("status").eq("user_id",user.id).eq("status","Approved").maybeSingle();
  if(error)throw error;
  if(!application)throw new Error("Öğrenci başvurunuz henüz onaylanmamış.");
 }
 el("loginScreen").classList.add("hidden");
 el("app").classList.remove("hidden");
 el("userLabel").textContent=(user.email||"Kullanıcı")+" · "+currentRole;
 makeNav();
 await openPage(isManagement()?"Genel Bakış":"Ana Sayfa");
}
el("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=el("loginButton");
 button.disabled=true;button.textContent="GİRİŞ YAPILIYOR...";
 el("loginMessage").classList.add("hidden");
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:el("email").value.trim(),
   password:el("password").value
  });
  if(error)throw error;
  const {data:profile,error:profileError}=await db.from("profiles")
   .select("role").eq("id",data.user.id).maybeSingle();
  if(profileError)throw profileError;
  if(!profile)throw new Error("Kullanıcı profili bulunamadı.");
  await enterApp(data.user,profile);
 }catch(e){
  showMessage("loginMessage","Giriş yapılamadı: "+e.message);
  await db.auth.signOut();
 }finally{
  button.disabled=false;button.textContent="GİRİŞ YAP";
 }
});
el("logoutButton").onclick=async()=>{
 await db.auth.signOut();
 currentUser=null;currentRole="";
 el("app").classList.add("hidden");
 el("loginScreen").classList.remove("hidden");
 el("password").value="";
};
(async()=>{
 try{
  const {data}=await db.auth.getSession();
  if(data.session){
   const user=data.session.user;
   const {data:profile,error}=await db.from("profiles").select("role").eq("id",user.id).maybeSingle();
   if(error)throw error;
   if(profile)await enterApp(user,profile);
  }
 }catch(e){showMessage("loginMessage","Oturum kontrolü: "+e.message)}
})();
</script>
</body>
</html>
